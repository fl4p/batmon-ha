apiVersion: v2
name: batmon-ha
description: Monitor various BMS over Bluetooth LE and publish to MQTT
type: application
home: https://github.com/fl4p/batmon-ha
sources:
  - https://github.com/fl4p/batmon-ha
maintainers:
  - name: fl4p
    url: https://github.com/fl4p
keywords:
  - bms
  - battery
  - bluetooth
