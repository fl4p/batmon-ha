name: Tests

# The full bmslib/test suite, on every push to master and every pull request.
#
# Until this existed, CI ran only test_changelog.py and test_release_versions.py on their
# own paths, so the suite never ran in CI at all. docker.yml gates the published image on
# this suite through the same composite action; the HA release itself is a submodule pin
# bump in fl4p/home-assistant-addons, which is a manual step -- check the Tests run for
# the commit you are pinning before bumping.
#
# What this does NOT cover: the image's other venvs (venv_esphome's bleak 3.0.2 /
# habluetooth set, the bumble and bluek stacks) are not installed here, and the image is
# musl while this is glibc. A change that only breaks those paths stays green here.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  # master runs are not cancelled: two quick pushes would otherwise leave the first
  # commit with no green run to check before pinning it (see the note above)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
