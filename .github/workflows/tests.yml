name: Tests

# The full bmslib/test suite. Until this existed, CI ran only test_changelog.py and
# test_release_versions.py on their own paths, so a change that broke the suite merged
# green -- 2.33 shipped a defect (a missing disable() argument) that the suite could not
# have caught but no run would have reported either.
#
# The venv mirrors the image's main venv: requirements.txt pins, plus aiobmsble installed
# --no-deps at the version the Dockerfile pins (a plain install drags bleak to 3.x, #275).
# The pin is read out of the Dockerfile so it cannot drift from the image.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the pinned test dependencies
        run: |
          AIOBMSBLE=$(sed -nE "s/.*venv\/bin\/pip3 install --no-deps '(aiobmsble==[^']+)'.*/\1/p" Dockerfile | head -1)
          if [ -z "$AIOBMSBLE" ]; then echo "aiobmsble pin not found in Dockerfile" >&2; exit 1; fi
          echo "aiobmsble pin: $AIOBMSBLE"
          pip install -r requirements.txt pytest numpy influxdb requests
          pip install --no-deps "$AIOBMSBLE"
      - run: python -m pytest -q -p no:cacheprovider bmslib/test
